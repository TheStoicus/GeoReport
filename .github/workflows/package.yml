name: Package and check GeoReport

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build tools
        run: brew install autoconf automake libtool pkg-config pcre2 libxml2

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DGEOREPORT_FETCH_LIBREDWG=ON -DGEOREPORT_FETCH_OPENXLSX=ON

      - name: Build
        if: success()
        run: cmake --build build --parallel 2

      - name: Package project
        if: always()
        run: |
          mkdir -p dist staging/GeoReport
          git archive HEAD | tar -x -C staging/GeoReport
          rm -f staging/GeoReport/GeoReport.zip
          (cd staging && zip -qr ../dist/GeoReport_ready.zip GeoReport)
          shasum -a 256 dist/GeoReport_ready.zip

      - name: Upload project archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GeoReport-ready-archive
          path: dist/GeoReport_ready.zip
          if-no-files-found: error
          retention-days: 14
